<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Cinetier ships one deliberate dark palette. color-scheme tells the browser
      so form controls and scrollbars match, and darkreader-lock tells the Dark
      Reader extension to leave the page alone: its dynamic mode rewrites every
      SVG fill to its own off-white, which turns the logo into a white blob and
      flattens the tier colours the interface is built on.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <title>Cinetier — Turn your film history into a tier list</title>
    <meta name="description" content="Import your IMDb or Letterboxd history and rank it. Runs entirely in your browser." />
    <!--
      Favicon: the same clapperboard mark as src/ui/Logo.tsx, inlined because a data
      URI can't reference the --color-logo-body / --color-logo-outline CSS custom
      properties, so their literal values (#606068 / #808088) are duplicated here.
      The three tier bars are deliberately bolder than Logo.tsx's (height 3 / rx 1.5
      here vs height 2.5 / rx 1.25 there) so they stay legible when the whole mark
      is rasterised down to a 16px browser tab icon — do not "fix" this to match.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='11' width='28' height='19' rx='3' fill='%23606068' stroke='%23808088' stroke-width='2'/%3E%3Cpath d='M2 4.5 L30 2 L30 10 L2 12.5 Z' fill='%23606068' stroke='%23808088' stroke-width='2'/%3E%3Crect x='7' y='16' width='18' height='3' rx='1.5' fill='%23e05263'/%3E%3Crect x='7' y='21' width='13' height='3' rx='1.5' fill='%23e8b44a'/%3E%3Crect x='7' y='26' width='8' height='3' rx='1.5' fill='%234a9de8'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <script>
      // Applied before the first paint. React mounts too late: a visitor on the
      // neon theme would see the default one for a frame on every single visit.
      // Inlined rather than imported for the same reason — a module request is a
      // round trip. Kept in step with src/services/theme.ts by tests/ui/theme.test.ts.
      try {
        var t = localStorage.getItem('cinetier:theme');
        if (t === 'neon') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* storage blocked; the default theme is already correct */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
