<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Cinetier ships one deliberate dark palette. color-scheme tells the browser
      so form controls and scrollbars match, and darkreader-lock tells the Dark
      Reader extension to leave the page alone: its dynamic mode rewrites every
      SVG fill to its own off-white, which turns the logo into a white blob and
      flattens the tier colours the interface is built on.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <title>Cinetier — Turn your film history into a tier list</title>
    <meta name="description" content="Import your IMDb or Letterboxd history and rank it. Runs entirely in your browser." />
    <!-- Generated from src/ui/logoMark.ts by vite-plugins/favicon.ts. Do not edit. -->
    <link rel="icon" href="%FAVICON%" />
    <!--
      The two faces the first screen actually paints (src/fonts.css): the
      Oswald wordmark and Inter body copy. Preloaded, not just self-hosted,
      so the browser does not discover them only after parsing the CSS that
      references them.
    -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/oswald/files/oswald-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <script>
      // Applied before the first paint. React mounts too late: a visitor on the
      // neon theme would see the default one for a frame on every single visit.
      // Inlined rather than imported for the same reason — a module request is a
      // round trip. Kept in step with src/services/theme.ts by tests/ui/theme.test.ts.
      try {
        var t = localStorage.getItem('cinetier:theme');
        if (t === 'neon') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* storage blocked; the default theme is already correct */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
